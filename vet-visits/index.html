<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#14424A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>JOMNEY Vet Clinic Visits</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&family=Noto+Sans+Khmer:wght@400;600&display=swap">
<style>
/* Layout: full-screen map; top bar with rep button; scrollable day chips; bottom sheet (peek / half / full) with Clinics, Report and Plan tabs; floating buttons on the right */
:root{
  --brand:#14424A; --ink:#18212C; --muted:#5E6B7A; --line:#E3E7EC; --bg:#F5F8F8; --panel:#FFFFFF;
  --accent:#C2571A; --link:#1F5FA8; --warn:#7A2E12; --warnbg:#FBEDE6; --tip:#5C4700; --tipbg:#FFF6D6;
  --s0:#8A94A0; --s1:#1E6FD9; --s2:#1E7A3C; --s3:#C62828; --s4:#E08A00; --s5:#4A4458;
  --body:"IBM Plex Sans","Noto Sans Khmer",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"IBM Plex Sans Condensed","Noto Sans Khmer","Arial Narrow",system-ui,sans-serif;
  --top:calc(52px + env(safe-area-inset-top,0px)); --chips:52px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:var(--body);color:var(--ink);background:var(--bg);font-size:15px}
#map{position:fixed;inset:0;z-index:0;background:#E9EEF2}
button,input,select,textarea{font:inherit;color:inherit}
#top{position:fixed;left:0;right:0;top:0;z-index:600;height:var(--top);padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));
  background:var(--brand);color:#fff;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
#top h1{font-family:var(--display);font-size:18px;margin:0;white-space:nowrap;flex:1;overflow:hidden;text-overflow:ellipsis}
#repBtn{flex:none;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:7px 12px;font-weight:600;font-size:13.5px;min-height:36px;max-width:55vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chips{position:fixed;left:0;right:0;top:var(--top);z-index:590;height:var(--chips);display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;
  padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;min-height:38px;cursor:pointer}
.chip small{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip[aria-pressed="true"] small{color:#C9D0D8}
.chip .today{font-size:10.5px;font-weight:600;background:#FFD54F;color:#4A3B00;border-radius:4px;padding:1px 4px}
.fabs{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(var(--top) + var(--chips) + 12px);z-index:450;display:flex;flex-direction:column;gap:10px}
.fab{width:46px;height:46px;border-radius:12px;border:0;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);display:grid;place-items:center;cursor:pointer}
.fab svg{width:22px;height:22px;stroke:var(--brand);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab:active{transform:scale(.95)}
#layersPanel{position:fixed;right:max(68px,calc(env(safe-area-inset-right,0px) + 68px));top:calc(var(--top) + var(--chips) + 12px);z-index:460;background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.25);padding:6px 4px;min-width:230px}
#layersPanel label{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:15px}
#layersPanel input{width:20px;height:20px;accent-color:var(--brand)}
#layersPanel hr{border:0;border-top:1px solid var(--line);margin:4px 8px}
#layersPanel .lab{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:6px 12px 0}
#here{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(70px,calc(env(safe-area-inset-right,0px) + 70px));top:calc(var(--top) + var(--chips) + 12px);z-index:470;
  background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.25);padding:10px 12px;font-size:14px;line-height:1.5}
#here .x{float:right;border:0;background:none;font-size:22px;line-height:1;padding:0 0 0 8px;color:var(--muted)}
.lnk{border:0;background:none;padding:0;color:var(--link);font-weight:600;text-align:left;cursor:pointer}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:500;background:var(--panel);border-radius:18px 18px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.18);
  display:flex;flex-direction:column;height:var(--peek);transition:height .25s ease;--peek:calc(112px + env(safe-area-inset-bottom,0px))}
#sheet.half{height:52%}
#sheet.full{height:calc(100% - var(--top) - var(--chips) - 8px)}
#grab{padding:8px 0 4px;display:grid;place-items:center;cursor:grab;touch-action:none}
#grab span{width:42px;height:5px;border-radius:3px;background:#C9D0D8}
#tabs{display:flex;gap:6px;padding:4px max(12px,env(safe-area-inset-left,0px)) 10px;border-bottom:1px solid var(--line);touch-action:none}
#tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 4px;font-weight:600;font-size:14px;min-height:44px}
#tabs button[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
#body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.bar2{display:flex;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 11px;font-size:13px;font-weight:600;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:12px;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);min-height:64px;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;cursor:pointer}
.row:active{background:var(--bg)}
.row .info{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{flex:none;width:34px;height:34px;border-radius:50%;color:#fff;font-weight:600;font-size:14px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.pr{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;margin-right:4px;vertical-align:1px}
.pr1{background:#FDE2E0;color:#9B1C1C} .pr2{background:#FFF0CC;color:#7A5200} .pr3{background:#EEF1F4;color:#4A5563}
.st{flex:none;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;color:#fff;white-space:nowrap;max-width:118px;overflow:hidden;text-overflow:ellipsis}
.note{margin:10px 16px;font-size:13px;line-height:1.45;color:var(--muted);background:var(--bg);border-radius:10px;padding:9px 12px}
.tip{color:var(--tip);background:var(--tipbg)}
.wrn{color:var(--warn);background:var(--warnbg)}
.empty{padding:24px 16px;color:var(--muted);text-align:center}
.detail{padding:10px 16px}
.dnav{display:flex;align-items:center;gap:8px}
.back{border:0;background:none;color:var(--link);font-weight:600;font-size:15px;padding:6px 0;min-height:40px}
.dnav .sp{flex:1}
.dnav button.nb{border:1px solid var(--line);background:#fff;border-radius:10px;min-width:44px;min-height:40px;font-weight:600}
.dnav button.nb:disabled{opacity:.35}
.detail h2{font-size:21px;margin:6px 0 2px;line-height:1.3}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:12px 0;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mono{font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:12px;font-weight:600;text-decoration:none;font-size:15px;border:0;cursor:pointer;padding:0 12px;text-align:center}
.btn.primary{background:var(--brand);color:#fff}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.wide{grid-column:1/-1}
.btn.tg{background:#229ED9;color:#fff}
.form{margin:16px 0 4px;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:#FBFCFC}
.form h3{margin:0 0 10px;font-size:15px;font-family:var(--display);text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 8px;font-size:14px;font-weight:600;min-height:46px;display:flex;align-items:center;gap:8px;text-align:left}
.opt i{flex:none;width:12px;height:12px;border-radius:50%}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);background:#F1F4F6}
.fld{display:grid;gap:6px;margin-top:12px}
.fld label{font-size:13px;color:var(--muted);font-weight:600}
.fld input,.fld textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;background:#fff;width:100%}
.fld textarea{min-height:70px;resize:vertical}
.inl{display:flex;gap:10px;align-items:end}
.inl .fld{flex:1;min-width:0}
.yn{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:46px}
.yn button{flex:1;border:0;background:#fff;font-weight:600;min-width:56px}
.yn button[aria-pressed="true"]{background:var(--ink);color:#fff}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:46px;background:#fff}
.stepper button{border:0;background:var(--bg);width:46px;height:100%;font-size:20px;font-weight:600}
.stepper input{border:0;text-align:center;width:100%;min-width:0;font-size:16px;font-variant-numeric:tabular-nums;padding:0}
.saved{font-size:13px;color:var(--s2);font-weight:600;margin-top:10px;min-height:18px}
table.sum{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.sum th,table.sum td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right}
table.sum th:first-child,table.sum td:first-child{text-align:left}
table.sum th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.sec{font-family:var(--display);font-size:14px;margin:16px 16px 6px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 16px}
.kpi{background:var(--bg);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.pbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex;margin:4px 16px 2px}
.pbar i{display:block;height:100%}
textarea.out{width:calc(100% - 32px);margin:8px 16px;min-height:140px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
.btns{display:grid;gap:10px;padding:8px 16px}
/* map bits */
.om{display:grid;place-items:center;border-radius:50%;color:#fff;font:600 12px var(--body);border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);font-variant-numeric:tabular-nums}
.om.hi{border-color:#FFD54F}
.om.sel{box-shadow:0 0 0 4px rgba(255,213,79,.95),0 1px 3px rgba(0,0,0,.4)}
.kh-label{background:transparent;border:0;box-shadow:none;font:600 11px var(--display);letter-spacing:.5px;text-transform:uppercase;color:#3A2F47;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;pointer-events:none;white-space:nowrap}
.kh-label::before{display:none}
.me{width:18px;height:18px;border-radius:50%;background:#1A73E8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
.leaflet-control-attribution{font-size:10px}
.leaflet-bottom{bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.hide-kh .kh-label{display:none}
/* rep picker */
#picker{position:fixed;inset:0;z-index:800;background:rgba(10,20,25,.55);display:grid;place-items:end center;padding:0 0 env(safe-area-inset-bottom,0px)}
#picker .card{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px 22px}
#picker h2{margin:0 0 4px;font-family:var(--display);font-size:20px}
#picker .who{display:grid;gap:10px;margin-top:14px}
#picker .who button{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-weight:600;font-size:16px;min-height:56px;text-align:left}
#picker .who button i{width:14px;height:14px;border-radius:50%}
#picker .who button small{margin-left:auto;color:var(--muted);font-weight:500;font-size:13px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));z-index:900;background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.3)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
</style>
</head>
<body>
<div id="map" role="region" aria-label="Map of vet clinics"></div>

<header id="top">
  <h1>Vet Clinic Visits</h1>
  <button id="repBtn" aria-label="Change who is using this phone"></button>
</header>
<nav id="chips" aria-label="Visit day"></nav>

<div class="fabs">
  <button class="fab" id="btnLayers" aria-label="Map layers" aria-expanded="false">
    <svg viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5z"/><path d="m2 13 10 5 10-5"/></svg></button>
  <button class="fab" id="btnLocate" aria-label="Where am I? Show nearest clinics">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  <button class="fab" id="btnFit" aria-label="Show all clinics of this day">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<div id="layersPanel" hidden>
  <div class="lab">Base map</div>
  <label><input type="radio" name="base" id="b-street" value="street" checked> Street map</label>
  <label><input type="radio" name="base" id="b-clean" value="clean"> Clean map</label>
  <label><input type="radio" name="base" id="b-sat" value="sat"> Satellite</label>
  <hr>
  <div class="lab">Show</div>
  <label><input type="checkbox" id="l-route" checked> Route line</label>
  <label><input type="checkbox" id="l-other" checked> Other clinics (grey dots)</label>
  <label><input type="checkbox" id="l-kh" checked> Khan borders</label>
</div>

<div id="here" hidden></div>
<div id="toast" hidden></div>

<section id="sheet" aria-label="Clinic list">
  <div id="grab" aria-hidden="true"><span></span></div>
  <div id="tabs" role="tablist">
    <button role="tab" id="t-list" data-tab="list" aria-selected="true">Clinics</button>
    <button role="tab" id="t-report" data-tab="report" aria-selected="false">Report</button>
    <button role="tab" id="t-plan" data-tab="plan" aria-selected="false">Plan</button>
  </div>
  <div id="body"></div>
</section>

<div id="picker" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="pk-h">
    <h2 id="pk-h">Who is using this phone?</h2>
    <div class="muted">Shows your own clinics and route. You can change it later from the top bar.</div>
    <div class="who" id="pk-list"></div>
  </div>
</div>

<script>
const REPS=["Met Machhearo","Oulvann SreyPich","Hing Sivmey"];
const RCOL=["#0B7A75","#8E44AD","#D9730D"];
const STAT=["To visit","Visited – Interested","Visited – Agreed","Visited – Declined","Revisit needed","Not found / closed"];
const SCOL=["#8A94A0","#1E6FD9","#1E7A3C","#C62828","#E08A00","#4A4458"];
const PRI=["","High","Medium","Low"];
const DAYS=[{d:"2026-11-19",l:"Thu 19"},{d:"2026-11-20",l:"Fri 20"},{d:"2026-11-21",l:"Sat 21"},{d:"2026-11-23",l:"Mon 23",revisit:true}];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtKm=m=>m<1000?Math.round(m)+" m":(m/1000).toFixed(1)+" km";
const pad=n=>String(n).padStart(2,"0");
const now=new Date(); const TODAY=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const byN=Object.fromEntries(CLINICS.map(c=>[c.n,c]));

/* ---------- saved state (this phone) ---------- */
function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
let rep=load("vet-rep",null);            // 0,1,2 or "all"
let reports=load("vet-reports",{});      // {n:{s,date,packs,disp,res,t,by}}
let imported=load("vet-imported",{});    // manager: reports pasted from reps
let orderMode=load("vet-order","sugg");  // "sugg" | "file"
const firstDay=DAYS.find(x=>x.d>=TODAY);
let day=(DAYS.find(x=>x.d===TODAY)||firstDay||DAYS[0]).d, tab="list", detail=null, selN=null;

function rep_of(c){return c.rep;}
function repOf(n){const r=reports[n]||imported[n];return r||null;}
function statusOf(c){const r=reports[c.n]||imported[c.n];return r?r.s:0;}
function ordOf(c){return orderMode==="sugg"?c.sord:c.ord;}
function mine(c){return rep==="all"||c.rep===rep;}
function isRevisit(c){const s=statusOf(c);return s===4||s===5||(s===0&&c.date<TODAY);}
function listFor(d){
  const dd=DAYS.find(x=>x.d===d);
  let l=CLINICS.filter(mine);
  if(d==="all") return l.sort((a,b)=>a.date.localeCompare(b.date)||a.rep-b.rep||ordOf(a)-ordOf(b));
  if(dd&&dd.revisit) return l.filter(isRevisit).sort((a,b)=>a.rep-b.rep||a.pri-b.pri||a.date.localeCompare(b.date)||ordOf(a)-ordOf(b));
  return l.filter(c=>c.date===d).sort((a,b)=>a.rep-b.rep||ordOf(a)-ordOf(b));
}
function seqLabel(c){const dd=DAYS.find(x=>x.d===day);return day==="all"||(dd&&dd.revisit)?String(c.n):String(ordOf(c));}

/* ---------- map ---------- */
const bases={
  street:L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:20,maxNativeZoom:19,attribution:"© OpenStreetMap"}),
  clean:L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{maxZoom:20,maxNativeZoom:19,attribution:"© OpenStreetMap © CARTO"}),
  sat:L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:20,maxNativeZoom:19,attribution:"Imagery © Esri"})
};
const map=L.map("map",{zoomControl:false,zoomSnap:0.25,layers:[bases.street]});
L.control.scale({metric:true,imperial:false,position:"bottomleft"}).addTo(map);
const khLayer=L.layerGroup(), otherLayer=L.layerGroup(), pinLayer=L.layerGroup(), routeLayer=L.layerGroup();
Object.entries(KHANS).forEach(([k,v])=>{
  L.polyline(v.r,{color:"#4A4458",weight:1.6,opacity:.75,dashArray:"6 4",interactive:false}).addTo(khLayer);
  L.tooltip({permanent:true,direction:"center",className:"kh-label",interactive:false}).setLatLng(v.c).setContent(esc(k)).addTo(khLayer);
});
khLayer.addTo(map); otherLayer.addTo(map); routeLayer.addTo(map); pinLayer.addTo(map);
map.on("zoomend",()=>document.body.classList.toggle("hide-kh",map.getZoom()<12.75));

function drawMap(){
  pinLayer.clearLayers(); otherLayer.clearLayers(); routeLayer.clearLayers();
  const list=listFor(day), ids=new Set(list.map(c=>c.n));
  CLINICS.forEach(c=>{
    if(ids.has(c.n))return;
    if($("#l-other").checked) L.circleMarker([c.lat,c.lng],{radius:5,color:"#fff",weight:1.5,fillColor:"#8A94A0",fillOpacity:.85})
      .bindTooltip(`#${c.n} ${esc(c.name)} · ${esc(REPS[c.rep])}`).on("click",()=>openClinic(c.n)).addTo(otherLayer);
  });
  list.forEach(c=>{
    const s=statusOf(c), cls=["om"]; if(c.pri===1)cls.push("hi"); if(c.n===selN)cls.push("sel");
    const size=32;
    L.marker([c.lat,c.lng],{icon:L.divIcon({className:"",html:`<div class="${cls.join(" ")}" style="width:${size}px;height:${size}px;background:${SCOL[s]}">${seqLabel(c)}</div>`,iconSize:[size,size],iconAnchor:[size/2,size/2]}),
      zIndexOffset:c.n===selN?3000:1000-ordOf(c),title:c.name,keyboard:false}).on("click",()=>openClinic(c.n)).addTo(pinLayer);
  });
  const dd=DAYS.find(x=>x.d===day);
  if($("#l-route").checked&&day!=="all"&&!(dd&&dd.revisit)){
    for(let r=0;r<3;r++){const pts=list.filter(c=>c.rep===r).map(c=>[c.lat,c.lng]);
      if(pts.length>1)L.polyline(pts,{color:RCOL[r],weight:4,opacity:.8,dashArray:"8 6",interactive:false}).addTo(routeLayer);}
  }
}
function fitDay(){
  const pts=listFor(day).map(c=>[c.lat,c.lng]);
  const b=pts.length?L.latLngBounds(pts):L.latLngBounds(CLINICS.map(c=>[c.lat,c.lng]));
  map.fitBounds(b,{paddingTopLeft:[24,130],paddingBottomRight:[70,140],maxZoom:16});
}

/* ---------- top bar, chips, picker ---------- */
function renderTop(){$("#repBtn").textContent=rep==="all"?"Manager · all reps":REPS[rep]??"Choose rep";}
function renderChips(){
  const c=$("#chips");
  const cnt=d=>listFor(d).length;
  c.innerHTML=DAYS.map(x=>{const n=cnt(x.d);return `<button class="chip" data-day="${x.d}" aria-pressed="${day===x.d}">${x.l}${x.revisit?" · revisit":""} <small>${n}</small>${x.d===TODAY?'<span class="today">TODAY</span>':""}</button>`;}).join("")+
    `<button class="chip" data-day="all" aria-pressed="${day==="all"}">All <small>${cnt("all")}</small></button>`;
  c.querySelectorAll(".chip").forEach(b=>b.onclick=()=>setDay(b.dataset.day));
  const on=c.querySelector('[aria-pressed="true"]'); if(on)on.scrollIntoView({inline:"center",block:"nearest"});
}
function setDay(d){day=d;detail=null;selN=null;renderChips();drawMap();fitDay();goTab("list");}
function openPicker(){
  const counts=[0,1,2].map(r=>CLINICS.filter(c=>c.rep===r).length);
  $("#pk-list").innerHTML=REPS.map((n,i)=>`<button data-rep="${i}"><i style="background:${RCOL[i]}"></i>${esc(n)}<small>${counts[i]} clinics</small></button>`).join("")+
    `<button data-rep="all"><i style="background:var(--ink)"></i>Manager · all reps<small>${CLINICS.length} clinics</small></button>`;
  $("#picker").hidden=false;
  $("#pk-list").querySelectorAll("button").forEach(b=>b.onclick=()=>{rep=b.dataset.rep==="all"?"all":+b.dataset.rep;save("vet-rep",rep);$("#picker").hidden=true;renderTop();setDay(day);});
}
$("#repBtn").onclick=openPicker;

/* ---------- sheet ---------- */
const sheet=$("#sheet");
function setSheet(s){sheet.classList.remove("half","full");if(s)sheet.classList.add(s);}
function lvl(){return sheet.classList.contains("full")?2:sheet.classList.contains("half")?1:0;}
(function(){let y0=null,mv=false;[$("#grab"),$("#tabs")].forEach(z=>{
  z.addEventListener("touchstart",e=>{y0=e.touches[0].clientY;mv=false;},{passive:true});
  z.addEventListener("touchmove",e=>{if(y0!==null&&Math.abs(e.touches[0].clientY-y0)>12)mv=true;},{passive:true});
  z.addEventListener("touchend",e=>{if(y0===null)return;const dy=e.changedTouches[0].clientY-y0;y0=null;if(!mv)return;setSheet(["","half","full"][dy<0?Math.min(2,lvl()+1):Math.max(0,lvl()-1)]);});});
  $("#grab").addEventListener("click",()=>setSheet(["half","full",""][lvl()]));})();
function goTab(t){tab=t;detail=null;document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===t)));render();}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{goTab(b.dataset.tab);if(!lvl())setSheet("half");});
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,1800);}

function row(c){
  const s=statusOf(c), dd=DAYS.find(x=>x.d===day);
  const sub=[rep==="all"?REPS[c.rep].split(" ")[0]:null,(day==="all"||(dd&&dd.revisit))?DAYS.find(x=>x.d===c.date).l:null,c.tel?c.phone:"No phone · walk in"].filter(Boolean).join(" · ");
  return `<button class="row" data-c="${c.n}"><span class="num" style="background:${SCOL[s]}">${seqLabel(c)}</span>
    <span class="info"><div class="t">${esc(c.name)}</div><div class="m"><span class="pr pr${c.pri}">${PRI[c.pri]}</span>${esc(sub)}</div></span>
    <span class="st" style="background:${SCOL[s]}">${esc(STAT[s].replace("Visited – ",""))}</span></button>`;
}
function render(){
  const b=$("#body");
  if(detail){b.innerHTML=detail();b.scrollTop=0;bindDetail();return;}
  if(tab==="list"){
    const l=listFor(day), dd=DAYS.find(x=>x.d===day), done=l.filter(c=>statusOf(c)>0).length;
    const orderCtl=day!=="all"&&!(dd&&dd.revisit)?`<div class="seg" role="group" aria-label="Visit order"><button data-o="sugg" aria-pressed="${orderMode==="sugg"}">Shortest order</button><button data-o="file" aria-pressed="${orderMode==="file"}">Plan order</button></div>`:"";
    let km=0; if(orderCtl){for(let r=0;r<3;r++){const p=l.filter(c=>c.rep===r);for(let i=1;i<p.length;i++)km+=map.distance([p[i-1].lat,p[i-1].lng],[p[i].lat,p[i].lng]);}}
    const head=`<div class="bar2">${orderCtl}<span class="muted mono">${done}/${l.length} reported${orderCtl?" · "+fmtKm(km)+" between clinics":""}</span></div>`;
    const intro=dd&&dd.revisit?`<div class="note tip">Clinics marked <b>Revisit needed</b> or <b>Not found / closed</b>, plus any planned clinic not yet reported after its day. Sorted by priority.</div>`:"";
    b.innerHTML=head+intro+(l.length?l.map(row).join(""):`<div class="empty">${dd&&dd.revisit?"Nothing to revisit yet.":"No clinics for this day."}</div>`)+
      (orderCtl?`<div class="note">“Shortest order” keeps the same clinics for the day and only changes the order to cut travel. “Plan order” is the order in the Excel plan.</div>`:"");
    b.querySelectorAll("[data-o]").forEach(x=>x.onclick=()=>{orderMode=x.dataset.o;save("vet-order",orderMode);drawMap();render();});
  }else if(tab==="report") renderReport(b);
  else renderPlan(b);
  b.querySelectorAll("[data-c]").forEach(x=>x.onclick=()=>openClinic(+x.dataset.c));
}

/* ---------- clinic detail + visit form ---------- */
function openClinic(n){
  const c=byN[n]; if(!c)return;
  const dd=DAYS.find(x=>x.d===day);
  if(day!=="all"&&!(dd&&dd.revisit)&&c.date!==day&&mine(c)){day=c.date;renderChips();}
  selN=n; drawMap(); if(lvl()!==2)setSheet("half");
  map.flyTo([c.lat,c.lng],Math.max(map.getZoom(),16),{duration:.6});
  setTimeout(()=>map.panBy([0,innerHeight*0.26-60],{animate:true}),650);
  const seq=listFor(day), k=seq.findIndex(x=>x.n===n), prev=seq[k-1], next=seq[k+1];
  const r=reports[n]||imported[n]||{s:0,date:TODAY,packs:PACKS[c.pri],disp:"",res:""};
  const f={s:r.s,date:r.date||TODAY,packs:r.packs??PACKS[c.pri],disp:r.disp||"",res:r.res||""};
  const dirUrl=`https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}${c.pid?"&destination_place_id="+c.pid:""}`;
  const gm=c.pid?`https://www.google.com/maps/place/?q=place_id:${c.pid}`:`https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lng}`;
  detail=()=>`<div class="detail">
    <div class="dnav"><button class="back">‹ List</button><span class="sp"></span>
      ${k>=0?`<button class="nb" ${prev?`data-nav="${prev.n}"`:"disabled"} aria-label="Previous clinic">‹</button><span class="mono muted">${k+1} / ${seq.length}</span><button class="nb" ${next?`data-nav="${next.n}"`:"disabled"} aria-label="Next clinic">›</button>`:""}</div>
    <div><span class="pr pr${c.pri}">${PRI[c.pri]} priority</span><span class="muted">#${c.n} · ${esc(REPS[c.rep])} · ${DAYS.find(x=>x.d===c.date).l}</span></div>
    <h2>${esc(c.name)}</h2>
    <div class="muted">★ ${c.rating} · ${c.reviews} Google reviews</div>
    ${c.note?`<div class="note tip" style="margin:10px 0">${esc(c.note)}</div>`:""}
    <dl class="kv">
      <dt>Phone</dt><dd>${c.tel?`<span class="mono" style="user-select:all">${esc(c.phone)}</span>`:"No phone on Google · walk in"}</dd>
      <dt>Address</dt><dd>${esc(c.addr)}</dd>
      <dt>Hours</dt><dd>${esc(c.hours)}</dd>
      <dt>Zone</dt><dd>${esc(c.zone)}</dd>
      ${next?`<dt>Next</dt><dd>${esc(next.name)} · ${fmtKm(map.distance([c.lat,c.lng],[next.lat,next.lng]))}</dd>`:""}
    </dl>
    <div class="actions">
      <a class="btn primary" href="${dirUrl}" target="_blank" rel="noopener">Directions</a>
      ${c.tel?`<a class="btn ghost" href="tel:${c.tel}">Call</a>`:`<a class="btn ghost" href="${gm}" target="_blank" rel="noopener">Google Maps</a>`}
    </div>
    <form class="form" id="vf" autocomplete="off">
      <h3>Visit result</h3>
      <div class="opts" role="group" aria-label="Status">${STAT.map((s,i)=>`<button type="button" class="opt" data-s="${i}" aria-pressed="${f.s===i}"><i style="background:${SCOL[i]}"></i>${esc(s)}</button>`).join("")}</div>
      <div class="inl">
        <div class="fld"><label for="f-packs">Packs given</label>
          <div class="stepper"><button type="button" data-step="-1" aria-label="One pack less">−</button><input id="f-packs" inputmode="numeric" value="${esc(f.packs)}"><button type="button" data-step="1" aria-label="One pack more">+</button></div></div>
        <div class="fld" style="flex:none"><label>Display placed</label>
          <div class="yn" role="group" aria-label="Display placed"><button type="button" data-d="Yes" aria-pressed="${f.disp==="Yes"}">Yes</button><button type="button" data-d="No" aria-pressed="${f.disp==="No"}">No</button></div></div>
      </div>
      <div class="fld"><label for="f-date">Actual visit date</label><input id="f-date" type="date" value="${esc(f.date)}"></div>
      <div class="fld"><label for="f-res">Result / next step</label><textarea id="f-res" placeholder="Who you met, interest, order, follow-up date…">${esc(f.res)}</textarea></div>
      <button type="submit" class="btn primary wide" style="width:100%;margin-top:12px">Save visit</button>
      <div class="saved" id="savedMsg">${reports[n]?"Saved on this phone · "+esc(new Date(reports[n].t).toLocaleString()):imported[n]?"From a pasted team report":""}</div>
    </form>
    ${next?`<button class="btn ghost" style="width:100%" data-nav="${next.n}">Next clinic: ${esc(next.name)} ›</button>`:""}
  </div>`;
  render();
  // form state
  const vf=$("#vf"); let st=f.s, disp=f.disp;
  vf.querySelectorAll("[data-s]").forEach(x=>x.onclick=()=>{st=+x.dataset.s;vf.querySelectorAll("[data-s]").forEach(y=>y.setAttribute("aria-pressed",String(y===x)));});
  vf.querySelectorAll("[data-d]").forEach(x=>x.onclick=()=>{disp=x.dataset.d;vf.querySelectorAll("[data-d]").forEach(y=>y.setAttribute("aria-pressed",String(y===x)));});
  vf.querySelectorAll("[data-step]").forEach(x=>x.onclick=()=>{const i=$("#f-packs");i.value=Math.max(0,(parseInt(i.value)||0)+ +x.dataset.step);});
  vf.onsubmit=e=>{e.preventDefault();
    if(st===0&&!$("#f-res").value.trim()){toast("Choose a visit result first");return;}
    const packs=st===0||st===5?0:Math.max(0,parseInt($("#f-packs").value)||0);
    reports[n]={s:st,date:$("#f-date").value||TODAY,packs,disp:st===5?"No":(disp||"No"),res:$("#f-res").value.trim(),t:Date.now(),by:rep==="all"?"Manager":REPS[rep]};
    save("vet-reports",reports); drawMap(); renderChips(); toast("Saved");
    $("#savedMsg").textContent="Saved on this phone · "+new Date().toLocaleTimeString();
  };
}
function bindDetail(){
  const b=$("#body");
  const bk=b.querySelector(".back"); if(bk)bk.onclick=()=>{detail=null;selN=null;drawMap();render();};
  b.querySelectorAll("[data-nav]").forEach(x=>x.onclick=()=>openClinic(+x.dataset.nav));
}

/* ---------- report ---------- */
function reportLine(c,r){return `#${c.n} | ${c.name} | ${STAT[r.s]} | ${r.date} | ${r.packs} | ${r.disp||"No"} | ${(r.res||"").replace(/\s*\n\s*/g," ")}`;}
function myReportText(){
  const mineL=CLINICS.filter(mine).filter(c=>reports[c.n]).sort((a,b)=>a.n-b.n);
  const who=rep==="all"?"Manager":REPS[rep];
  const packs=mineL.reduce((a,c)=>a+(reports[c.n].packs||0),0), disp=mineL.filter(c=>reports[c.n].disp==="Yes").length;
  return `JOMNEY vet visits – ${who} – ${new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short"})}\n`+
    `${mineL.length} clinics reported · ${packs} packs · ${disp} displays\n`+
    `# | Clinic | Status | Date | Packs | Display | Result\n`+mineL.map(c=>reportLine(c,reports[c.n])).join("\n");
}
function parseReports(txt){
  let n=0;
  txt.split(/\r?\n/).forEach(line=>{
    const m=line.match(/^\s*#(\d+)\s*\|\s*(.*?)\s*\|\s*(.*?)\s*\|\s*(\d{4}-\d{2}-\d{2})\s*\|\s*(\d+)\s*\|\s*(Yes|No)\s*\|\s*(.*)$/);
    if(!m)return; const s=STAT.indexOf(m[3]); if(s<0||!byN[+m[1]])return;
    imported[+m[1]]={s,date:m[4],packs:+m[5],disp:m[6],res:m[7],t:Date.now(),by:"import"}; n++;
  });
  save("vet-imported",imported); return n;
}
function excelRows(){
  return CLINICS.slice().sort((a,b)=>a.n-b.n).map(c=>{const r=reports[c.n]||imported[c.n];
    return r?[STAT[r.s],r.date,r.packs,r.disp||"No",(r.res||"").replace(/\t|\n/g," ")].join("\t"):["To visit","","","",""].join("\t");}).join("\n");
}
async function copyText(t,okMsg){
  try{await navigator.clipboard.writeText(t);toast(okMsg);return true;}catch(e){
    const ta=$("#outBox"); if(ta){ta.value=t;ta.hidden=false;ta.focus();ta.select();} toast("Select all and copy the text below");return false;}
}
function renderReport(b){
  const l=CLINICS.filter(mine), cnt=STAT.map((_,i)=>l.filter(c=>statusOf(c)===i).length);
  const packs=l.reduce((a,c)=>{const r=reports[c.n]||imported[c.n];return a+(r?r.packs||0:0);},0);
  const plannedPacks=l.reduce((a,c)=>a+PACKS[c.pri],0), disp=l.filter(c=>{const r=reports[c.n]||imported[c.n];return r&&r.disp==="Yes";}).length;
  const visited=cnt[1]+cnt[2]+cnt[3];
  b.innerHTML=`<div class="sec">${rep==="all"?"Team progress":"My progress"} · ${l.length} clinics</div>
    <div class="pbar">${STAT.map((s,i)=>i?`<i style="width:${100*cnt[i]/l.length}%;background:${SCOL[i]}"></i>`:"").join("")}</div>
    <div class="kpis"><div class="kpi"><b>${visited}</b><span>visited of ${l.length}</span></div><div class="kpi"><b>${packs}</b><span>packs of ${plannedPacks}</span></div><div class="kpi"><b>${disp}</b><span>displays placed</span></div></div>
    <div style="padding:0 8px"><table class="sum"><tbody>${STAT.map((s,i)=>`<tr><td><span class="dot" style="background:${SCOL[i]}"></span>${esc(s)}</td><td>${cnt[i]}</td></tr>`).join("")}</tbody></table></div>
    <div class="sec">Send my report</div>
    <div class="btns">
      <a class="btn tg" id="tgBtn" href="https://t.me/share/url?url=%20&amp;text=${encodeURIComponent(myReportText())}" target="_blank" rel="noopener">Send on Telegram</a>
      <button class="btn ghost" id="cpBtn">Copy report text</button>
    </div>
    <div class="note">Reports are saved on this phone only. Send them to your manager at the end of each day.</div>
    ${rep==="all"?`<div class="sec">Manager · combine team reports</div>
      <div class="note">Paste the report messages from the reps here (all three at once is fine), then copy the result into Excel.</div>
      <textarea class="out" id="pasteBox" placeholder="Paste report messages here"></textarea>
      <div class="btns"><button class="btn primary" id="impBtn">Add pasted reports</button>
      <button class="btn ghost" id="xlBtn">Copy for Excel (Visit Plan J5:N43)</button>
      ${Object.keys(imported).length?`<button class="btn ghost" id="clrImp">Clear pasted reports (${Object.keys(imported).length})</button>`:""}</div>
      <div class="note">In Excel, click cell <b>J5</b> on the Visit Plan sheet and paste. It fills Status, Actual visit date, Packs given, Display placed and Result for all 39 clinics in # order.</div>`:""}
    <textarea class="out" id="outBox" hidden readonly></textarea>`;
  $("#cpBtn").onclick=()=>copyText(myReportText(),"Report copied");
  if(rep==="all"){
    $("#impBtn").onclick=()=>{const n=parseReports($("#pasteBox").value);toast(n?`Added ${n} clinic reports`:"No report lines found");if(n){drawMap();renderChips();render();}};
    $("#xlBtn").onclick=()=>copyText(excelRows(),"Copied 39 rows for Excel");
    const ci=$("#clrImp"); if(ci)ci.onclick=()=>{imported={};save("vet-imported",imported);drawMap();renderChips();render();};
  }
}

/* ---------- plan ---------- */
function renderPlan(b){
  const reps=[0,1,2].map(r=>DAYS.slice(0,3).map(d=>CLINICS.filter(c=>c.rep===r&&c.date===d.d).length));
  b.innerHTML=`<div class="sec">Plan at a glance</div>
    <div class="kpis"><div class="kpi"><b>39</b><span>clinics, never sold before</span></div><div class="kpi"><b>$${PLAN.budget.toLocaleString("en-US",{minimumFractionDigits:2})}</b><span>budget (estimate)</span></div><div class="kpi"><b>${PLAN.packs}</b><span>sample packs</span></div></div>
    <div class="note">Priority: <b>11 High / 9 Medium / 19 Low</b>. ${PACKS[1]} sample packs per clinic, about $${PLAN.avg.toFixed(2)} per clinic. Saturday is a half day. Closed or missed clinics move to <b>Mon 23 Nov</b>.</div>
    <div class="sec">Visits per day</div>
    <div style="padding:0 8px;overflow-x:auto"><table class="sum"><thead><tr><th>Rep</th>${DAYS.slice(0,3).map(d=>`<th>${d.l}</th>`).join("")}<th>Total</th></tr></thead><tbody>
      ${REPS.map((n,i)=>`<tr><td><span class="dot" style="background:${RCOL[i]}"></span>${esc(n)}</td>${reps[i].map(v=>`<td>${v}</td>`).join("")}<td><b>${reps[i].reduce((a,b)=>a+b,0)}</b></td></tr>`).join("")}
    </tbody></table></div>
    <div class="note">Zones: <b>Met Machhearo</b> Central · <b>Oulvann SreyPich</b> North + West · <b>Hing Sivmey</b> South, South-West + East.</div>
    <div class="sec">Shortest order saves</div>
    <div style="padding:0 8px;overflow-x:auto"><table class="sum"><thead><tr><th>Rep · day</th><th>Plan</th><th>Shortest</th></tr></thead><tbody>
      ${ORDER.days.map(([r,d,a,s])=>`<tr><td>${esc(REPS[r].split(" ")[0])} · ${DAYS.find(x=>x.d===d).l}</td><td>${a} km</td><td><b>${s} km</b></td></tr>`).join("")}
      <tr><td><b>Total</b></td><td><b>${ORDER.file} km</b></td><td><b>${ORDER.sugg} km</b></td></tr></tbody></table></div>
    <div class="note">Straight-line distance between clinics, not counting the trip from home. Road distance is longer.</div>
    <div class="sec">Timeline</div>
    <div style="padding:0 8px"><table class="sum"><tbody>
      <tr><td>Wed 18 Nov</td><td style="text-align:left">Confirm plan and budget, call clinics to book, prepare packs, displays, leaflets</td></tr>
      <tr><td>Thu 19 – Sat 21</td><td style="text-align:left">Visits: pitch, give sample packs, place display, update status after each visit</td></tr>
      <tr><td>Mon 23 Nov</td><td style="text-align:left">Revisit closed or missed clinics, send results to manager</td></tr>
    </tbody></table></div>
    <div class="sec">Activation days (proposed)</div>
    ${PLAN.act.map(a=>`<button class="row" data-c="${a.n}"><span class="num" style="background:var(--accent);font-size:12px">${a.l.split(" ")[1]}</span><span class="info"><div class="t">${esc(byN[a.n].name)}</div><div class="m">${esc(a.l)} · ★ ${byN[a.n].rating} · ${byN[a.n].reviews} reviews</div></span></button>`).join("")}
    <div class="note">Only where the clinic agrees at the first visit.</div>`;
}

/* ---------- layers + locate ---------- */
const lp=$("#layersPanel");
$("#btnLayers").onclick=()=>{lp.hidden=!lp.hidden;$("#btnLayers").setAttribute("aria-expanded",String(!lp.hidden));};
map.on("click",()=>{lp.hidden=true;});
document.querySelectorAll('input[name="base"]').forEach(i=>i.onchange=()=>{Object.values(bases).forEach(b=>map.removeLayer(b));bases[i.value].addTo(map);});
$("#l-other").onchange=drawMap; $("#l-route").onchange=drawMap;
$("#l-kh").onchange=e=>e.target.checked?khLayer.addTo(map):khLayer.remove();
$("#btnFit").onclick=()=>{setSheet("");fitDay();};
let me=null,meC=null; const here=$("#here");
function showHere(h){here.innerHTML=`<button class="x" aria-label="Close">×</button>${h}`;here.hidden=false;here.querySelector(".x").onclick=()=>here.hidden=true;
  here.querySelectorAll("[data-near]").forEach(b=>b.onclick=()=>{here.hidden=true;openClinic(+b.dataset.near);});}
$("#btnLocate").onclick=()=>{
  if(!navigator.geolocation){showHere("Location is not available on this device.");return;}
  showHere("Finding your location…");
  navigator.geolocation.getCurrentPosition(pos=>{
    const ll=[pos.coords.latitude,pos.coords.longitude];
    if(me){map.removeLayer(me);map.removeLayer(meC);}
    meC=L.circle(ll,{radius:pos.coords.accuracy,color:"#1A73E8",weight:1,fillOpacity:.1,interactive:false}).addTo(map);
    me=L.marker(ll,{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:4000}).addTo(map);
    setSheet(""); map.flyTo(ll,15,{duration:.6});
    const pool=CLINICS.filter(mine).filter(c=>statusOf(c)===0||statusOf(c)===4);
    const near=pool.map(c=>({c,d:map.distance(ll,[c.lat,c.lng])})).sort((a,b)=>a.d-b.d).slice(0,3);
    showHere(near.length?`<b>Nearest clinics still to visit</b><br>`+near.map(x=>`<button class="lnk" data-near="${x.c.n}">#${x.c.n} ${esc(x.c.name)}</button> <span class="mono muted">${fmtKm(x.d)}</span>`).join("<br>"):"All your clinics are reported.");
  },err=>showHere(err.code===1?"Location permission was refused. Allow location for this page in the browser settings, then tap again.":"Could not get your location. Check that GPS is on and try again."),
  {enableHighAccuracy:true,timeout:15000,maximumAge:30000});
};

/* ---------- start ---------- */
renderTop(); renderChips(); drawMap(); fitDay(); render();
if(rep===null) openPicker();
</script>
</body>
</html>
